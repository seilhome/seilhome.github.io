<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="1" stop-color="#EFE5D7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E1C491"/>
      <stop offset="0.55" stop-color="#B88950"/>
      <stop offset="1" stop-color="#7E542F"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7B982"/>
      <stop offset="1" stop-color="#A97842"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6D4B2D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="92" fill="url(#bg)" stroke="#D7C2A4" stroke-width="6" filter="url(#shadow)"/>

  <!-- premium P arc -->
  <path d="M210 390V130H286C363 130 411 169 411 230C411 292 363 331 286 331H247"
        fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- skyline integrated into the P -->
  <path d="M102 352V282L144 250V352Z" fill="#C5A16E"/>
  <path d="M151 352V211L198 175V352Z" fill="url(#tower)"/>
  <path d="M205 352V242L247 214V352Z" fill="#9C724B"/>

  <!-- subtle ground sweep -->
  <path d="M87 379C157 350 226 351 288 373C336 390 376 389 424 370"
        fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
</svg>