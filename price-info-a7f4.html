<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

  <title>분양가표 | 강릉 우미 린 더 프리미어</title>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f2ef;color:#222;font-family:Arial,"Noto Sans KR",sans-serif;letter-spacing:-.02em}.wrap{width:min(1120px,100%);margin:0 auto;padding:18px 12px 110px}.hero{padding:25px 20px;border-radius:22px;background:linear-gradient(140deg,#1d1d1d,#38312b);color:#fff;box-shadow:0 16px 40px rgba(0,0,0,.16)}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#e76518;font-size:12px;font-weight:800}.hero h1{margin:14px 0 8px;font-size:clamp(25px,6vw,38px);line-height:1.25}.hero p{margin:0;color:#ddd;font-size:14px;line-height:1.65}.notice{margin:14px 2px 16px;padding:14px 16px;border:1px solid #ead8c8;border-radius:15px;background:#fff8f2;color:#665549;font-size:13px;line-height:1.65}.sheet{margin:14px 0 0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 12px 35px rgba(52,42,32,.11)}.sheet img{display:block;width:100%;height:auto}.sheet img+img{border-top:1px solid #eee}.tip{text-align:center;margin:13px 0 0;color:#777;font-size:12px}.actions{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.25fr;gap:8px;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(255,255,255,.95);border-top:1px solid #e7e2dc;backdrop-filter:blur(14px)}.actions a{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;font-weight:900;text-decoration:none}.home{background:#eee9e4;color:#333}.call{background:#e76518;color:#fff}@media(min-width:760px){.wrap{padding-top:30px}.hero{padding:34px}.sheet{padding:14px}.sheet img{border-radius:10px}.actions{left:50%;right:auto;width:min(620px,calc(100% - 24px));transform:translateX(-50%);bottom:14px;border:1px solid #ddd;border-radius:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <span class="badge">신청 고객 전용</span>
      <h1>강릉 우미 린 더 프리미어<br>공급금액 안내</h1>
      <p>문자로 요청하신 공급금액 및 납부일정 자료입니다.</p>
    </section>
    <div class="notice"><strong>계약금 이벤트 및 특별혜택 안내</strong><br>계약금 이벤트, 계약 가능 동·호수, 추가 혜택은 계약 시점과 현장 상황에 따라 달라질 수 있습니다. 정확한 적용 조건과 현재 가능한 혜택은 상담을 통해 별도로 안내받아 주세요.</div>
    <section class="sheet" aria-label="공급금액 자료">
      <img src="images/price-sheet-a7f4-top.jpg" alt="강릉 우미 린 더 프리미어 공급금액 상단" loading="eager">
      <img src="images/price-sheet-a7f4-bottom.jpg" alt="강릉 우미 린 더 프리미어 공급금액 하단" loading="lazy">
    </section>
  </main>
  <nav class="actions" aria-label="상담 메뉴">
    <a class="home" href="/">홈페이지</a>
    <a class="call" href="tel:0339000342">전화상담 033-900-0342</a>
  </nav>

</body>
</html>
