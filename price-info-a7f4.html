<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#173e31">
  <title>분양가표 | 강릉 우미 린 더 프리미어</title>
  <style>
    @font-face{font-family:'Lynn Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/lynn-sans-regular.woff') format('woff')}
    @font-face{font-family:'Lynn Sans';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/lynn-sans-bold.woff') format('woff')}
    :root{--green:#173e31;--green2:#0e382c;--gold:#c6a066;--gold-soft:#f0d7ad;--paper:#f3f5f1;--text:#21352d;--muted:#6b786f;--line:#d8e0da;--white:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--text);font-family:'Lynn Sans',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;letter-spacing:-.025em;word-break:keep-all}.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:24px 0 112px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:170px;mix-blend-mode:multiply}.brand small{color:var(--muted);font-size:11px;letter-spacing:.08em}.home-link{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--green);font-size:13px;font-weight:700;text-decoration:none}.hero{position:relative;overflow:hidden;padding:38px 36px;border-radius:28px;background:linear-gradient(135deg,var(--green2),#1c4d3c);color:#fff;box-shadow:0 22px 60px rgba(14,56,44,.16)}.hero:after{content:'';position:absolute;right:-90px;top:-120px;width:320px;height:320px;border-radius:50%;background:rgba(240,215,173,.11)}.badge{position:relative;z-index:1;display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--gold-soft);color:var(--green);font-size:11px;font-weight:800}.hero h1{position:relative;z-index:1;margin:15px 0 9px;font-size:clamp(28px,5vw,42px);line-height:1.2;letter-spacing:-.05em}.hero p{position:relative;z-index:1;margin:0;color:#dbe7e0;font-size:14px;line-height:1.75}.benefit{margin:18px 0;padding:24px 22px;border:1px solid #dcc79e;border-radius:20px;background:#fff;color:var(--text);box-shadow:0 12px 34px rgba(20,54,41,.07);text-align:center}.benefit-kicker{display:inline-flex;padding:5px 10px;border-radius:999px;background:var(--green);color:#fff;font-size:11px;font-weight:800}.benefit h2{margin:11px 0 7px;color:var(--green);font-size:clamp(22px,4.7vw,31px);line-height:1.3;letter-spacing:-.04em}.benefit h2 strong{color:#9b713d}.benefit p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.benefit-call{display:inline-flex;align-items:center;justify-content:center;margin-top:15px;min-height:48px;padding:12px 21px;border-radius:999px;background:var(--green);color:#fff;font-size:15px;font-weight:800;text-decoration:none}.sheet-label{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 4px 11px}.sheet-label strong{font-size:19px;color:var(--green)}.sheet-label span{font-size:11px;color:var(--muted)}.sheet{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 16px 44px rgba(20,54,41,.08);border:1px solid rgba(27,67,52,.10);padding:12px}.sheet img{display:block;width:100%;height:auto;border-radius:11px}.sheet img+img{margin-top:10px}.tip{text-align:center;margin:13px 0 0;color:var(--muted);font-size:11px}.actions{position:fixed;z-index:20;left:50%;bottom:14px;width:min(620px,calc(100% - 24px));transform:translateX(-50%);display:grid;grid-template-columns:1fr 1.15fr;gap:8px;padding:9px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 38px rgba(14,56,44,.12);backdrop-filter:blur(14px)}.actions a{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:800;text-decoration:none}.home{background:#eef2ee;color:var(--green)}.call{background:var(--green);color:#fff}
    @media(max-width:700px){.wrap{width:calc(100% - 24px);padding-top:13px}.topbar{margin-bottom:10px}.brand img{width:145px}.brand small{display:none}.home-link{font-size:12px;padding:8px 12px}.hero{padding:28px 22px;border-radius:21px}.hero h1{font-size:29px}.benefit{padding:21px 16px;border-radius:18px}.benefit h2{font-size:24px}.sheet{padding:6px;border-radius:17px}.sheet img{border-radius:10px}.sheet-label{margin-top:22px}.actions{bottom:8px}.actions a{min-height:50px;font-size:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="brand" href="/" aria-label="강릉 우미 린 더 프리미어 홈페이지"><img src="images/logo.jpg" alt="우미 린"><small>GANGNEUNG · THE PREMIER</small></a>
      <a class="home-link" href="/">홈페이지</a>
    </div>
    <section class="hero">
      <span class="badge">신청 고객 전용</span>
      <h1>강릉 우미 린 더 프리미어<br>공급금액 안내</h1>
      <p>문자로 요청하신 공급금액 및 납부일정 자료입니다.<br>홈페이지와 동일한 안내 기준으로 확인하실 수 있습니다.</p>
    </section>
    <section class="benefit" aria-label="10월 계약 혜택">
      <span class="benefit-kicker">10월까지만</span>
      <h2>계약금 완납 시 <strong>연 10% 이자지원</strong></h2>
      <p>현재 적용 가능한 계약조건과 잔여 동·호수는 현장 상황에 따라 달라질 수 있습니다.<br>직접 상담을 원하시면 홈페이지에서 방문 희망일을 선택해 예약해 주세요.</p>
      <a class="benefit-call" href="/?visit=1#reservation">방문상담 예약하기</a>
    </section>
    <div class="sheet-label"><strong>공급금액표</strong><span>확대해서 확인할 수 있습니다</span></div>
    <section class="sheet" aria-label="공급금액 자료">
      <img src="images/price-sheet-a7f4-top.jpg" alt="강릉 우미 린 더 프리미어 공급금액 상단" loading="eager">
      <img src="images/price-sheet-a7f4-bottom.jpg" alt="강릉 우미 린 더 프리미어 공급금액 하단" loading="lazy">
    </section>
  </main>
  <nav class="actions" aria-label="상담 메뉴">
    <a class="home" href="/">홈페이지</a>
    <a class="call" href="/?visit=1#reservation">방문상담</a>
  </nav>
</body>
</html>
