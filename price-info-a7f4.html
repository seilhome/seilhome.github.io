  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f2ef;color:#222;font-family:Arial,"Noto Sans KR",sans-serif;letter-spacing:-.02em}.wrap{width:min(1120px,100%);margin:0 auto;padding:18px 12px 110px}.hero{padding:25px 20px;border-radius:22px;background:linear-gradient(140deg,#1d1d1d,#38312b);color:#fff;box-shadow:0 16px 40px rgba(0,0,0,.16)}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#e76518;font-size:12px;font-weight:800}.hero h1{margin:14px 0 8px;font-size:clamp(25px,6vw,38px);line-height:1.25}.hero p{margin:0;color:#ddd;font-size:14px;line-height:1.65}.notice{margin:16px 2px 18px;padding:22px 18px;border:2px solid #f0c39f;border-radius:18px;background:#fff8f2;color:#2b211c;text-align:center;box-shadow:0 8px 24px rgba(231,101,24,.10)}.notice-title{display:block;margin-bottom:10px;color:#e76518;font-size:clamp(22px,5.5vw,30px);font-weight:900;line-height:1.25}.notice-main{display:block;font-size:clamp(18px,4.6vw,24px);font-weight:900;line-height:1.45}.notice-sub{display:block;margin-top:10px;color:#6b5547;font-size:clamp(14px,3.8vw,18px);font-weight:700;line-height:1.55}.notice-call{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;padding:13px 18px;border-radius:12px;background:#e76518;color:#fff;font-size:clamp(17px,4.4vw,22px);font-weight:900;text-decoration:none}.sheet{margin:14px 0 0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 12px 35px rgba(52,42,32,.11)}.sheet img{display:block;width:100%;height:auto}.sheet img+img{border-top:1px solid #eee}.tip{text-align:center;margin:13px 0 0;color:#777;font-size:12px}.actions{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.25fr;gap:8px;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(255,255,255,.95);border-top:1px solid #e7e2dc;backdrop-filter:blur(14px)}.actions a{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;font-weight:900;text-decoration:none}.home{background:#eee9e4;color:#333}.call{background:#e76518;color:#fff}@media(min-width:760px){.wrap{padding-top:30px}.hero{padding:34px}.sheet{padding:14px}.sheet img{border-radius:10px}.actions{left:50%;right:auto;width:min(620px,calc(100% - 24px));transform:translateX(-50%);bottom:14px;border:1px solid #ddd;border-radius:18px}}

<body>
  <main class="wrap">
    <section class="hero">

    </section>
    <div class="notice"><span class="notice-title">계약금 이벤트 혜택 · 잔여 동·호수 안내</span><span class="notice-main">현재 적용 가능한 혜택과 계약 가능 동·호수는<br>직접 연락 주시면 자세히 안내해 드립니다.</span><span class="notice-sub">잔여 동·호수와 이벤트 내용은 현장 상황에 따라 실시간으로 달라질 수 있습니다.</span><a class="notice-call" href="tel:0339000342">전화로 바로 확인하기 033-900-0342</a></div>
    <section class="sheet" aria-label="공급금액 자료">
      <img src="images/price-sheet-a7f4-top.jpg" alt="강릉 우미 린 더 프리미어 공급금액 상단" loading="eager">
      <img src="images/price-sheet-a7f4-bottom.jpg" alt="강릉 우미 린 더 프리미어 공급금액 하단" loading="lazy">
    </section>
  </main>
  <nav class="actions" aria-label="상담 메뉴">

    <a class="call" href="tel:0339000342">전화상담 033-900-0342</a>
